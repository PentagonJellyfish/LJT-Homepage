name: Test Token Write
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "<h1>test</h1>" > index.html
      - name: Push to test-write branch
        uses: JamesIves/github-pages-deploy-action@v4.6.7
        with:
          branch: test-write
          folder: .
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
