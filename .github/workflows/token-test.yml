name: Test Token Write
on:
  push:
    paths:
      - 'test-write.txt'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push new branch with GITHUB_TOKEN
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "token write test"
          git push origin HEAD:refs/heads/test-write
