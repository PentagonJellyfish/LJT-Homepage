name: Test Token Write
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "<h1>token-test</h1>" > index.html
      - name: Push new branch with GITHUB_TOKEN
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "token write test"
          git push origin HEAD:refs/heads/test-write
